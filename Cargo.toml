[package]
name = "secure_safe"
version = "0.1.0"
edition = "2024"

[features]
fuzzing = ["dep:afl"]

[[bin]]
name = "fuzz_target"
path = "src/bin/fuzz_target.rs"
required-features = ["fuzzing"]

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = "0.11.0"
crossterm = "0.29.0"
libc = "0.2"
obfstr = "0.4.6"
owo-colors = "4.3.0"


rand_core = {version = "0.6", features = ["getrandom"]}
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
zeroize = "1.9.0"
zstd = "0.13.3"
blake3 = "1.5"
tempfile = "3.27.0"
afl = { version = "0.18", optional = true }
rand = "0.10.2"
inotify = "0.11.5"

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
panic = "unwind"


# Security-relevant mistakes
mem_forget = "deny"
exit = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

# Maintainability
large_stack_arrays = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "deny"
