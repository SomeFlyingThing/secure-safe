[package]
name = "secure_safe"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
crossterm = "0.29.0"
obfstr = "0.4.6"
owo-colors = "4.3.0"


rand_core = {version = "0.6", features = ["getrandom"]}
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
zeroize = "1.9.0"
zstd = "0.13.3"

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
panic = "unwind"
